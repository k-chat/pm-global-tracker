  origin.setAttribute('class','intro-origin');origin.setAttribute('cx',s[0].toFixed(1));origin.setAttribute('cy',s[1].toFixed(1));origin.setAttribute('r','3.2');
  svg.appendChild(origin);
 }
 let done=false;
 const finish=()=>{if(done)return;done=true;root.classList.remove('intro-run');if(svg)svg.replaceChildren()};
 // The reader always wins: the first sign of intent ends the opening at once.

   const len=p.line.getTotalLength()||1;
   if(Math.abs(len-p.len)>1){p.len=len;p.line.style.strokeDasharray=len;p.glow.style.strokeDasharray=len}
  });
  if(origin){const s=screenOf(worldOf(originPos));origin.setAttribute('cx',s[0].toFixed(1));origin.setAttribute('cy',s[1].toFixed(1))}
  paths.forEach(p=>{
   const off=p.len*(1-easeOut(clamp01((t-260-p.delay)/880)));
   p.line.style.strokeDashoffset=off;p.glow.style.strokeDashoffset=off;
   p.line.style.opacity=String(out);p.glow.style.opacity=String(.16*out);
  });

 };
 requestAnimationFrame(tick);
})();
